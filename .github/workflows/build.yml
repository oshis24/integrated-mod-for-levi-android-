name: Build LeviModules

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM: "android-35"
  ANDROID_ABI: "arm64-v8a"

jobs:
  build:
    name: Android ARM64 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;${NDK_VERSION}"

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-35|ndk;${NDK_VERSION}" || true

          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}"

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"

      - name: Verify native library
        run: |
          test -f build/libminecraft.so

          file build/libminecraft.so

          readelf -h build/libminecraft.so | grep -E \
            "Class|Machine"

      - name: Prepare artifact
        run: |
          rm -rf staging

          mkdir -p \
            staging/lib/arm64-v8a

          cp \
            build/libminecraft.so \
            staging/lib/arm64-v8a/libminecraft.so

          cp \
            manifest.json \
            staging/manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviModules-arm64-dev
          path: staging/
          if-no-files-found: error
