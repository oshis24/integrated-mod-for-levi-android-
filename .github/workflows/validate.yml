name: Validate Native Profile

on:
  push:
    paths:
      - "profiles/**"
      - "include/**"
      - "src/**"

  pull_request:
    paths:
      - "profiles/**"
      - "include/**"
      - "src/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  MINECRAFT_VERSION: "1.26.44.3"
  PROFILE_DIR: "profiles/1.26.44.3"

jobs:
  profile:
    name: Validate 1.26.44.3 Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check profile state
        id: profile
        run: |
          echo "Minecraft target: ${MINECRAFT_VERSION}"
          echo "Profile directory: ${PROFILE_DIR}"
          echo ""

          if [ ! -d "${PROFILE_DIR}" ]; then
            echo "::warning::Native profile ${MINECRAFT_VERSION} has not been created yet."
            echo "state=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Profile directory exists."

          if [ -f "${PROFILE_DIR}/profile.hpp" ]; then
            echo "profile.hpp: FOUND"
          else
            echo "profile.hpp: MISSING"
          fi

          if [ -f "${PROFILE_DIR}/signatures.hpp" ]; then
            echo "signatures.hpp: FOUND"
          else
            echo "signatures.hpp: MISSING"
          fi

          if [ -f "${PROFILE_DIR}/offsets.hpp" ]; then
            echo "offsets.hpp: FOUND"
          else
            echo "offsets.hpp: MISSING"
          fi

          echo "state=present" >> "$GITHUB_OUTPUT"

      - name: Validate completed profile
        if: steps.profile.outputs.state == 'present'
        run: |
          echo "Checking native profile files..."

          missing=0

          for file in \
            profile.hpp \
            signatures.hpp \
            offsets.hpp
          do
            if [ ! -f "${PROFILE_DIR}/${file}" ]; then
              echo "::warning::Missing ${PROFILE_DIR}/${file}"
              missing=1
            else
              echo "FOUND: ${PROFILE_DIR}/${file}"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Profile exists but is incomplete."
            echo "This is allowed during RE development."
            exit 0
          fi

          echo ""
          echo "All profile files are present."

      - name: Check module directories
        run: |
          test -d include/levi/modules
          test -d src/modules

          echo "Module directories: OK"

      - name: Check native profile placeholders
        run: |
          if [ -d "${PROFILE_DIR}" ]; then
            if grep -R -nE \
              '0x123456|0xDEADBEEF|0xCAFEBABE' \
              "${PROFILE_DIR}" \
              2>/dev/null; then

              echo "::error::Placeholder native address detected."
              exit 1
            fi
          fi

          echo "No known placeholder addresses detected."

      - name: Show RE status
        run: |
          echo "======================================"
          echo " LeviModules Native RE Status"
          echo "======================================"
          echo "Minecraft : ${MINECRAFT_VERSION}"
          echo "ABI       : arm64-v8a"
          echo ""
          echo "ViewModel   : RE in progress"
          echo "Freelook    : RE in progress"
          echo "ItemPhysics : RE in progress"
          echo ""
          echo "Native profile validation is non-blocking"
          echo "until the RE profile is complete."
